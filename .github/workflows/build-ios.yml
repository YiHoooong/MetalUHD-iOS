name: Build unsigned IPA

# The build publishes the IPA as a release asset, so it needs write access.
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "rust-core/**"
      - "ios-app/**"
      - "project.yml"
      - "build-ios.sh"
      - "build-ipa.sh"
      - ".github/workflows/build-ios.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build MetalUHD.ipa
    # Needs Xcode 16+ for the iOS 18 SDK. macos-14 ships Xcode 15.4 / iOS 17.5,
    # which cannot build a deploymentTarget of 18.0.
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode on the runner
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)"
          echo "Selected: $latest"
          sudo xcode-select -s "$latest"
          echo "DEVELOPER_DIR=$latest/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install Rust + iOS targets
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustc --version

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: rust-ios-${{ hashFiles('rust-core/Cargo.toml', 'rust-core/Cargo.lock') }}
          restore-keys: rust-ios-

      - name: Build Rust core and repackage AirliftFFI.xcframework
        run: ./build-ios.sh

      - name: Build unsigned IPA
        run: ./build-ipa.sh Release

      # GitHub Actions artifacts are always zip files. Publish the IPA as a
      # release asset instead, so the download is the .ipa itself.
      - name: Publish IPA as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' project.yml)"
          TAG="v${VERSION}"
          echo "Release tag: ${TAG}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — replacing its IPA asset."
          else
            gh release create "${TAG}" --prerelease --title "MetalUHD ${TAG}" \
              --notes "Unsigned IPA built from ${GITHUB_SHA} (${GITHUB_REF_NAME})."
          fi
          gh release upload "${TAG}" build/MetalUHD.ipa --clobber
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/MetalUHD.ipa"
          ls -lh build/MetalUHD.ipa
          echo "DIRECT_IPA_URL=${URL}"
          {
            echo "### Direct IPA (no zip)"
            echo ""
            echo "[MetalUHD.ipa](${URL})"
            echo ""
            echo '```sh'
            echo "gh release download ${TAG} -R ${GITHUB_REPOSITORY} -p MetalUHD.ipa -O MetalUHD.ipa"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
